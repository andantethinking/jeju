<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JEJU FAMILY TRAVEL MAGAZINE</title>
  <style>
    :root {
      --primary: #1e3a2b;       /* 짙은 제주 숲 그린 */
      --accent: #d97706;        /* 따뜻한 감귤 앰버 */
      --bg: #f7f6f2;            /* 따뜻한 매거진 미색지 */
      --surface: #ffffff;
      --text: #222222;
      --text-muted: #6b7280;
      --border: #e8e6df;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Serif KR", serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #2b2b2b;
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Magazine App Wrapper */
    .magazine-app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background-color: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    /* Top Magazine Bar */
    .mag-topbar {
      height: 48px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(247, 246, 242, 0.95);
      backdrop-filter: blur(10px);
      z-index: 50;
    }
    .mag-vol {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--primary);
      text-transform: uppercase;
    }
    .mag-page-indicator {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Page Viewport */
    .book-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: pan-y pinch-zoom;
    }

    .book-slider {
      display: flex;
      height: 100%;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .page {
      min-width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 24px 20px 80px;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar Custom */
    .page::-webkit-scrollbar { width: 4px; }
    .page::-webkit-scrollbar-thumb { background: #d1cfc7; border-radius: 4px; }

    /* Bottom Control Bar */
    .mag-bottombar {
      height: 60px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
    }
    .nav-btn {
      background: none;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .nav-btn:active { background: var(--border); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .toc-quick {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d1cfc7;
      cursor: pointer;
      transition: all 0.3s;
    }
    .dot.active {
      width: 20px;
      border-radius: 10px;
      background: var(--primary);
    }

    /* --- PAGE 1: COVER --- */
    .cover-page {
      background: linear-gradient(rgba(30, 58, 43, 0.75), rgba(20, 36, 27, 0.9)), url('https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=800&q=80') center/cover;
      color: #fff;
      display: flex;
